<svg xmlns="http://www.w3.org/2000/svg" width="400" height="329" viewBox="0 0 400 329" role="img" aria-label="Clover" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Clover</title>
<clipPath id="c"><rect width="400" height="329" rx="14"/></clipPath>
