<text x="24" y="44" font-size="20" font-weight="700" fill="#fafafa">Clover</text>
<rect x="24" y="58" width="50" height="22" rx="11" fill="#008137"/><text x="49.0" y="73" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Live</text>
<text x="24" y="115" font-size="14" fill="#ffffff" fill-opacity="0.84">A 4chan redesign that keeps the boards,</text>
<text x="24" y="136" font-size="14" fill="#ffffff" fill-opacity="0.84">anonymity, and bump-order threads, and</text>
<text x="24" y="157" font-size="14" fill="#ffffff" fill-opacity="0.84">rebuilds everything a reader touches: a real</text>
