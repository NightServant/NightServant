<text x="24" y="199" font-size="14" fill="#ffffff" fill-opacity="0.84">test-first components on Radix primitives.</text>
<text x="24" y="220" font-size="14" fill="#ffffff" fill-opacity="0.84">Board and thread data comes from 4chan's</text>
<text x="24" y="241" font-size="14" fill="#ffffff" fill-opacity="0.84">read-only JSON API.</text>
