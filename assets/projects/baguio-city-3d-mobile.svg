<svg xmlns="http://www.w3.org/2000/svg" width="400" height="350" viewBox="0 0 400 350" role="img" aria-label="Baguio 3D" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Baguio 3D</title>
<clipPath id="c"><rect width="400" height="350" rx="14"/></clipPath>
<g clip-path="url(#c)"><rect width="400" height="350" fill="#1c1a17"/><rect width="6" height="350" fill="#8c2318"/></g>
<text x="24" y="44" font-size="20" font-weight="700" fill="#fafafa">Baguio 3D</text>
<rect x="24" y="58" width="120" height="22" rx="11" fill="#8c2318"/><text x="84.0" y="73" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">In development</text>
<text x="24" y="115" font-size="14" fill="#ffffff" fill-opacity="0.84">An interactive 3D map and field guide to</text>
<text x="24" y="136" font-size="14" fill="#ffffff" fill-opacity="0.84">Baguio City: real-elevation terrain, six</text>
<text x="24" y="157" font-size="14" fill="#ffffff" fill-opacity="0.84">jeepney routes with a fare calculator, a</text>
<text x="24" y="178" font-size="14" fill="#ffffff" fill-opacity="0.84">four-era history timeline, and an eat-and-</text>
<text x="24" y="199" font-size="14" fill="#ffffff" fill-opacity="0.84">stay directory. Geospatial data lives in</text>
<text x="24" y="220" font-size="14" fill="#ffffff" fill-opacity="0.84">PostGIS and is served through Next.js route</text>
<text x="24" y="241" font-size="14" fill="#ffffff" fill-opacity="0.84">handlers with Redis caching, with no paid</text>
<text x="24" y="262" font-size="14" fill="#ffffff" fill-opacity="0.84">map keys.</text>
<line x1="24" y1="282" x2="376" y2="282" stroke="#ffffff" stroke-opacity="0.14"/>
<text x="24" y="304" font-size="13" fill="#ffffff" fill-opacity="0.62">Next.js · TypeScript · MapLibre GL · PostgreSQL /</text>
<text x="24" y="326" font-size="13" fill="#ffffff" fill-opacity="0.62">PostGIS · Prisma · Redis</text>
</svg>
