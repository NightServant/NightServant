<svg xmlns="http://www.w3.org/2000/svg" width="400" height="329" viewBox="0 0 400 329" role="img" aria-label="Worktrack" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Worktrack</title>
<clipPath id="c"><rect width="400" height="329" rx="14"/></clipPath>
<g clip-path="url(#c)"><rect width="400" height="329" fill="#18181b"/><rect width="6" height="329" fill="#c2410c"/></g>
<text x="24" y="44" font-size="20" font-weight="700" fill="#fafafa">Worktrack</text>
<rect x="24" y="58" width="50" height="22" rx="11" fill="#c2410c"/><text x="49.0" y="73" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Live</text>
<text x="24" y="115" font-size="14" fill="#ffffff" fill-opacity="0.84">A job-search tracker with an application</text>
<text x="24" y="136" font-size="14" fill="#ffffff" fill-opacity="0.84">pipeline, analytics, and a CV builder that</text>
<text x="24" y="157" font-size="14" fill="#ffffff" fill-opacity="0.84">keeps every version. Row-level security</text>
<text x="24" y="178" font-size="14" fill="#ffffff" fill-opacity="0.84">scopes every table to the signed-in user,</text>
<text x="24" y="199" font-size="14" fill="#ffffff" fill-opacity="0.84">and a demo mode shows the real screens over</text>
<text x="24" y="220" font-size="14" fill="#ffffff" fill-opacity="0.84">sample data without an account. Continues a</text>
<text x="24" y="241" font-size="14" fill="#ffffff" fill-opacity="0.84">project started by Ensues.</text>
<line x1="24" y1="261" x2="376" y2="261" stroke="#ffffff" stroke-opacity="0.14"/>
<text x="24" y="283" font-size="13" fill="#ffffff" fill-opacity="0.62">Next.js 15 · React 19 · Supabase Postgres ·</text>
<text x="24" y="305" font-size="13" fill="#ffffff" fill-opacity="0.62">TanStack Query · Tiptap · Vitest</text>
</svg>
