name: Profile Analytics Dashboard

on:
  schedule:
    - cron: "17 3 * * *"    # daily; off the top of the hour, when GitHub delays scheduled runs most
  push:                     # re-render whenever the renderer changes (the bot's own commits don't retrigger)
    branches: [main]
    paths:
      - .github/scripts/dashboard.py
      - .github/workflows/dashboard.yml
  workflow_dispatch:

concurrency:                # a push-triggered run and the daily run never race each other's commit
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commits the rendered SVGs
    steps:
      - uses: actions/checkout@v4
      - name: Render dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/dashboard.py --check
          python3 .github/scripts/dashboard.py "${{ github.repository_owner }}" assets
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dashboard-*.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update analytics dashboard"
          git pull --rebase origin main   # main may have moved while rendering
          git push
